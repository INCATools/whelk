name: Scala CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # OWL API 5.5 requires Java 11
        java: [ 11, 21 ]
    name: Java ${{ matrix.java }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up SBT
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt test "project coreNative" test "project coreJS" test
